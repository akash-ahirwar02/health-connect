variables:
  AWS_DEFAULT_REGION: "us-east-1"
  REPOSITORY_URL: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

stages:
  - build
  - deploy

.build-template:
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  stage: build
  before_script:
    - apk add --no-cache aws-cli
    - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $REPOSITORY_URL
  script:
    - docker build -t $REPOSITORY_URL/$SERVICE_NAME:$CI_COMMIT_SHORT_SHA -t $REPOSITORY_URL/$SERVICE_NAME:latest ./$SERVICE_NAME
    - docker push $REPOSITORY_URL/$SERVICE_NAME:$CI_COMMIT_SHORT_SHA
    - docker push $REPOSITORY_URL/$SERVICE_NAME:latest

build-patient-ui:
  extends: .build-template
  variables:
    SERVICE_NAME: "patient-ui"

build-api-gateway:
  extends: .build-template
  variables:
    SERVICE_NAME: "api-gateway"

build-auth-service:
  extends: .build-template
  variables:
    SERVICE_NAME: "auth-service"

build-records-service:
  extends: .build-template
  variables:
    SERVICE_NAME: "records-service"

build-analytics-service:
  extends: .build-template
  variables:
    SERVICE_NAME: "analytics-service"

build-appointment-service:
  extends: .build-template
  variables:
    SERVICE_NAME: "appointment-service"

build-audit-service:
  extends: .build-template
  variables:
    SERVICE_NAME: "audit-service"

build-billing-service:
  extends: .build-template
  variables:
    SERVICE_NAME: "billing-service"

deploy-k8s:
  image: bitnami/kubectl:latest
  stage: deploy
  script:
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
    - |
      find k8s/ -name "*.yaml" -exec sed -i "s|REPOSITORY_URL|$REPOSITORY_URL|g" {} +
      find k8s/ -name "*.yaml" -exec sed -i "s|IMAGE_TAG|$CI_COMMIT_SHORT_SHA|g" {} +
    - kubectl apply -f k8s/
  only:
    - main
